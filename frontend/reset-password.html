<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Race Dash — Reset password</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/error-logger.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Race Dash</h1>
    <div class="meta">Reset password</div>
  </header>

  <main style="max-width: 440px; margin: 32px auto;">
    <section class="panel">
      <h2 style="margin-top:0">Set a new password</h2>
      <div id="no-token" class="muted" style="display:none; font-size:13px;">
        This page needs to be opened from the link in your reset email.
        <br /><a href="/forgot-password">Request a new reset link →</a>
      </div>

      <form id="reset-form" style="display:none;">
        <div style="margin-bottom: 10px;">
          <label class="muted" style="font-size:12px;">New password (min 8 chars)</label>
          <input type="password" id="pw-new" required minlength="8" style="width:100%;" autofocus />
        </div>
        <div style="margin-bottom: 10px;">
          <label class="muted" style="font-size:12px;">Confirm new password</label>
          <input type="password" id="pw-confirm" required minlength="8" style="width:100%;" />
        </div>
        <button type="submit" class="primary" style="width:100%;" id="submit-btn">Set new password</button>
        <div id="msg" style="margin-top: 10px; font-size: 13px;"></div>
      </form>

      <div style="margin-top: 12px; font-size: 12px;">
        <a href="/login">← Back to log in</a>
      </div>
    </section>
  </main>

  <script src="/static/config.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const form = document.getElementById("reset-form");
      const noToken = document.getElementById("no-token");
      if (!token) {
        noToken.style.display = "block";
        return;
      }
      form.style.display = "block";

      const btn = document.getElementById("submit-btn");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPw = document.getElementById("pw-new").value;
        const confirmPw = document.getElementById("pw-confirm").value;
        if (newPw !== confirmPw) {
          msg.style.color = "var(--bad)";
          msg.textContent = "New password and confirmation don't match.";
          return;
        }
        btn.disabled = true;
        msg.style.color = "var(--muted)";
        msg.textContent = "Saving…";
        try {
          const res = await fetch((window.API_BASE || "") + "/api/auth/reset_password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, new_password: newPw }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || res.statusText);
          }
          msg.style.color = "var(--accent-2)";
          msg.textContent = "Password updated. Redirecting to log in…";
          setTimeout(() => location.replace("/login"), 1200);
        } catch (err) {
          msg.style.color = "var(--bad)";
          msg.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
