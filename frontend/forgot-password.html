<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Race Dash — Forgot password</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <h1>Race Dash</h1>
    <div class="meta">Forgot password</div>
  </header>

  <main style="max-width: 440px; margin: 32px auto;">
    <section class="panel">
      <h2 style="margin-top:0">Reset your password</h2>
      <div class="muted" style="font-size:13px; margin-bottom:12px;">
        Enter the email you signed up with. If we have an account on it,
        we'll send a link you can use to set a new password.
      </div>

      <form id="forgot-form">
        <div style="margin-bottom: 10px;">
          <label class="muted" style="font-size:12px;">Email</label>
          <input type="email" id="email" required autofocus style="width:100%;" />
        </div>
        <button type="submit" class="primary" style="width:100%;" id="submit-btn">Send reset link</button>
        <div id="msg" style="margin-top: 10px; font-size: 13px;"></div>
      </form>

      <div style="margin-top: 12px; font-size: 12px;">
        <a href="/login">← Back to log in</a>
      </div>
    </section>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    (function () {
      const form = document.getElementById("forgot-form");
      const btn = document.getElementById("submit-btn");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        msg.style.color = "var(--muted)";
        msg.textContent = "Sending…";
        const email = document.getElementById("email").value.trim();
        try {
          const res = await fetch((window.API_BASE || "") + "/api/auth/request_password_reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          if (!res.ok) {
            const text = await res.text().catch(() => res.statusText);
            throw new Error(text);
          }
          msg.style.color = "var(--accent-2)";
          msg.textContent = "If an account exists for that email, a reset link has been sent. Check your inbox (and spam folder).";
          form.reset();
        } catch (err) {
          msg.style.color = "var(--bad)";
          msg.textContent = "Something went wrong: " + err.message;
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
