<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Race Dash — Events</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <div class="row">
      <h1>Race Dash</h1>
      <div class="meta">Events</div>
    </div>
    <div id="user-bar" class="row"></div>
  </header>

  <main>
    <section class="panel">
      <h2>New event</h2>
      <form id="new-event-form" class="row" style="flex-wrap: wrap;">
        <input type="text" id="event-name" placeholder="Event name (e.g. Nota GP — Round 3)" required />
        <input type="text" id="natsoft-url" placeholder="Pick a meeting → URL fills in here (or type demo://)" style="flex:1; min-width: 280px;" />
        <button type="button" id="find-meeting-btn" class="primary">Find your meeting…</button>
        <button type="submit" class="primary">Create</button>
      </form>
      <div class="muted" style="margin-top: 8px; font-size: 12px;">
        Click <strong>Find your meeting…</strong> to pick from currently-running Natsoft meetings.
        Or paste <code>demo://</code> in the URL box for synthetic data.
      </div>
    </section>

    <!-- Meeting picker modal -->
    <div id="meeting-picker-modal" class="modal-backdrop" style="display:none">
      <div class="modal" style="max-width: 760px;">
        <div class="row" style="justify-content: space-between; align-items: baseline; margin-bottom: 10px;">
          <h2 style="margin:0;">Find a meeting</h2>
          <button class="icon-btn" id="meeting-picker-close">×</button>
        </div>
        <div class="row" style="margin-bottom: 12px;">
          <label class="muted" style="font-size:12px;">Discipline</label>
          <select id="meeting-discipline">
            <option value="0">Circuit Racing</option>
            <option value="1">Bikes</option>
          </select>
          <label class="muted" style="font-size:12px;">
            <input type="checkbox" id="meeting-live-only" checked /> Live now only
          </label>
          <span class="spacer"></span>
          <span id="meeting-picker-status" class="muted" style="font-size:12px;"></span>
        </div>
        <div id="meeting-picker-list" style="max-height: 480px; overflow:auto; border:1px solid var(--border); border-radius: 6px;"></div>
      </div>
    </div>

    <section class="panel">
      <h2>Events</h2>
      <ul id="events-list" class="events-list"></ul>
      <div id="events-empty" class="muted" style="display:none">No events yet. Create one above.</div>
    </section>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/header-bar.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
