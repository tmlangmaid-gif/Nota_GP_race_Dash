<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Race Dash — Competitors</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="row">
      <a href="/"><button class="icon-btn">Home</button></a>
      <a id="back-link"><button class="icon-btn">Dashboard</button></a>
      <h1 id="event-name">…</h1>
      <span class="tag">competitors</span>
    </div>
    <div class="row">
      <span style="color: var(--border); margin: 0 4px;">|</span>
      <span id="user-bar" class="row" style="gap: 8px;"></span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="row" style="justify-content: space-between; align-items: baseline; gap:10px; flex-wrap: wrap;">
        <div class="muted" style="font-size:13px;">
          Every car in this event with summary stats. Click a card to expand its lap history.
        </div>
        <div class="row">
          <label class="muted" style="font-size:12px;">Filter</label>
          <select id="filter">
            <option value="all">All cars</option>
            <option value="competitors">Competitors only</option>
            <option value="tracked">Our tracked cars</option>
          </select>
          <label class="muted" style="font-size:12px;">Sort</label>
          <select id="sort">
            <option value="best">Best lap</option>
            <option value="laps">Most laps</option>
            <option value="last">Last lap</option>
            <option value="number">Car #</option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Cars</h2>
      <div id="car-cards"></div>
      <div id="cars-empty" class="muted" style="display:none">No laps yet.</div>
    </section>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/header-bar.js"></script>
  <script src="/static/competitors.js"></script>
</body>
</html>
