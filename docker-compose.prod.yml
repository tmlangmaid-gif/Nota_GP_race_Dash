# Production compose for the Hostinger VPS.
# Sits behind the existing Traefik reverse proxy (cert resolver: letsencrypt,
# websecure entrypoint, HTTP→HTTPS auto-redirect).
#
# Required env (set in .env next to this file — see .env.example):
#   POSTGRES_PASSWORD  strong random password for the Postgres user
#   RACEDASH_HOST      hostname Traefik should route to this backend (must DNS to this VPS)
#   ALLOWED_ORIGINS    comma-separated list of frontend origins (e.g. https://yourapp.vercel.app)

services:
  db:
    image: postgres:16-alpine
    container_name: racedash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: racedash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: racedash
    volumes:
      - racedash-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racedash -d racedash"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: racedash-backend:latest
    container_name: racedash-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Pull every key=value pair from .env into the container as env vars, so
    # adding a new var (e.g. RESEND_API_KEY) is a one-line edit to .env without
    # touching the compose file.
    env_file: .env
    environment:
      # Explicit overrides built from compose-time substitution.
      DATABASE_URL: postgresql+psycopg://racedash:${POSTGRES_PASSWORD}@db:5432/racedash
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      PORT: "8000"
    labels:
      - "traefik.enable=true"
      # Accept both the new api.speeddemondash.com hostname AND the legacy
      # Hostinger-provided racedash.srv1595222.hstgr.cloud during migration,
      # so old bookmarks / Stripe webhook URLs keep working until everything
      # is moved over. Drop the legacy host from this rule once the cutover
      # is fully complete.
      - "traefik.http.routers.racedash.rule=Host(`${RACEDASH_HOST:?RACEDASH_HOST is required}`,`racedash.srv1595222.hstgr.cloud`)"
      - "traefik.http.routers.racedash.entrypoints=websecure"
      - "traefik.http.routers.racedash.tls.certresolver=letsencrypt"
      - "traefik.http.services.racedash.loadbalancer.server.port=8000"

volumes:
  racedash-db:
